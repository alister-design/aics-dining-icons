<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171b2f">
  <meta name="application-name" content="AICS Dining Report">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AICS Dining">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./aics-icon-192.png">
  <link rel="apple-touch-icon" href="./aics-icon-512.png">
  <title>AICS Dining Report</title>
  <style>
    :root { color-scheme: dark; --navy: #171b2f; --gold: #e5c27b; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: var(--navy); }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .app { position: fixed; inset: 0; display: flex; flex-direction: column; }
    .loading { position: absolute; z-index: 2; inset: 0; display: grid; place-items: center; padding: 24px;
      background: var(--navy); color: white; text-align: center; transition: opacity .25s ease; }
    .loading-inner { max-width: 360px; }
    .loading img { width: 76px; height: 76px; object-fit: contain; margin-bottom: 14px; }
    .loading h1 { font-size: 1.15rem; margin: 0 0 8px; }
    .loading p { font-size: .92rem; line-height: 1.45; margin: 0; color: #d8dbea; }
    iframe { border: 0; display: block; width: 100%; height: 100%; background: white; }
    .offline { display: none; color: white; padding: 28px; text-align: center; }
    @media (display-mode: standalone) { body { overscroll-behavior: none; } }
  </style>
</head>
<body>
  <main class="app">
    <div id="loading" class="loading" role="status" aria-live="polite">
      <div class="loading-inner">
        <img src="./aics-icon-192.png" alt="">
        <h1>AICS Dining Report</h1>
        <p>Opening the dining report… Please wait while the secure reporting system loads.</p>
      </div>
    </div>
    <iframe id="dining-app" title="AICS Dining Report" src="https://script.google.com/macros/s/AKfycbyV_RLvPmE_cTT6iD_7AlB10OspRSibzRU0B0ZftDH-FwtPSzWuo5n3fHiDCMRJqw/exec" allow="clipboard-read; clipboard-write" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </main>
  <script>
    const frame = document.getElementById('dining-app');
    const loading = document.getElementById('loading');
    frame.addEventListener('load', () => {
      loading.style.opacity = '0';
      setTimeout(() => { loading.style.display = 'none'; }, 300);
    });
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.warn('PWA offline shell unavailable:', err));
      });
    }
  </script>
</body>
</html>
