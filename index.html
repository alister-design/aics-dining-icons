<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171b2f">
  <meta name="application-name" content="AICS Dining Report">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AICS Dining">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./aics-icon-192.png">
  <link rel="apple-touch-icon" href="./aics-icon-512.png">
  <title>AICS Dining Report</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: #171b2f; }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { position: fixed; inset: 0; background: #171b2f; }
    iframe { border: 0; display: block; width: 100%; height: 100%; background: #fff; }
  </style>
</head>
<body>
  <main>
    <iframe id="dining-app" title="AICS Dining Report" src="https://script.google.com/macros/s/AKfycbyV_RLvPmE_cTT6iD_7AlB10OspRSibzRU0B0ZftDH-FwtPSzWuo5n3fHiDCMRJqw/exec" allow="clipboard-read; clipboard-write" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </main>
  <script>
    // Keep the PWA shell installable. The dining report itself requires internet.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.warn('PWA service worker registration failed:', err));
      });
    }
  </script>
</body>
</html>
